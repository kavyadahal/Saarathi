<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarathi — Knowledge Graph Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #212120;
    --border:      rgba(255,255,255,0.10);
    --border-2:    rgba(255,255,255,0.16);
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:    #2c2c2a;
    --edge:        #46453f;
    --edge-hi:     #c3c2b7;

    /* categorical — fixed order, slots 1-4 (dark steps) */
    --c-code:      #3987e5;  /* slot 1 blue */
    --c-document:  #d95926;  /* slot 2 orange */
    --c-rationale: #199e70;  /* slot 3 aqua */
    --c-concept:   #c98500;  /* slot 4 yellow */

    --accent:      #3987e5;
    --danger:      #e66767;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr 340px;
    grid-template-rows: 60px 1fr;
    grid-template-areas:
      "top   top   top"
      "left  main  right";
    height: 100vh;
    width: 100vw;
  }

  /* ---------- top bar ---------- */
  .topbar {
    grid-area: top;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    min-width: 0;
  }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; white-space:nowrap; }
  .brand .dot { width:9px;height:9px;border-radius:50%;background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .stats { display:flex; gap:10px; flex-wrap:wrap; overflow:hidden; }
  .stat-tile {
    display:flex; flex-direction:column; align-items:flex-start;
    padding:5px 12px; border:1px solid var(--border); border-radius:8px;
    background: var(--surface-2); min-width:64px;
  }
  .stat-tile .v { font-weight:700; font-size:15px; font-variant-numeric: tabular-nums; }
  .stat-tile .l { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  .topbar-spacer { flex: 1; }
  .menu-btn {
    display:none; background:var(--surface-2); color:var(--text-primary);
    border:1px solid var(--border); border-radius:7px; padding:7px 10px; cursor:pointer; font-size:13px;
  }

  /* ---------- panels (shared) ---------- */
  aside.sidebar {
    background: var(--surface);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sidebar-left  { grid-area: left;  border-right: 1px solid var(--border); }
  .sidebar-right { grid-area: right; border-left: 1px solid var(--border); }

  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    padding: 10px 12px 12px;
  }
  .panel h3 {
    margin: 0 0 8px 0; font-size: 11px; text-transform: uppercase; letter-spacing:.05em;
    color: var(--text-muted); display:flex; align-items:center; justify-content:space-between; font-weight:600;
  }
  .panel h3 button {
    background:none; border:1px solid var(--border-2); color:var(--text-secondary);
    border-radius:5px; padding:2px 6px; font-size:10px; cursor:pointer; text-transform:none; letter-spacing:0;
  }
  .panel h3 button:hover { color:var(--text-primary); border-color: var(--text-secondary); }

  input[type="search"] {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border-2); background: var(--page); color: var(--text-primary);
    font-size: 13px; outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }

  .search-results { margin-top:8px; max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; }
  .search-results .none { color:var(--text-muted); font-size:12px; padding:4px 2px; }
  .result-row {
    display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:6px; cursor:pointer;
    font-size:12.5px; color:var(--text-secondary);
  }
  .result-row:hover { background: var(--surface); color: var(--text-primary); }
  .swatch { width:9px; height:9px; border-radius:50%; flex:none; }

  .scroll-list { max-height: 260px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .check-row {
    display:flex; align-items:center; gap:7px; padding:4px 4px; border-radius:6px; font-size:12.5px;
    color: var(--text-secondary); cursor:pointer; user-select:none;
  }
  .check-row:hover { background: var(--surface); }
  .check-row input { accent-color: var(--accent); }
  .check-row .cnt { margin-left:auto; color:var(--text-muted); font-variant-numeric:tabular-nums; font-size:11px; }
  .check-row .label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* folder tree */
  .tree-panel .scroll-list { max-height: 320px; }
  details.tnode { margin: 1px 0; }
  details.tnode > summary {
    list-style: none; cursor:pointer; padding:4px 5px; border-radius:6px;
    font-size:12.5px; color: var(--text-secondary); display:flex; align-items:center; gap:6px;
  }
  details.tnode > summary::-webkit-details-marker { display:none; }
  details.tnode > summary:hover { background: var(--surface); color:var(--text-primary); }
  details.tnode > summary .tri { font-size:9px; width:10px; color:var(--text-muted); transition: transform .12s; }
  details.tnode[open] > summary .tri { transform: rotate(90deg); }
  .tnode .indent { margin-left: 14px; border-left: 1px dashed var(--border-2); padding-left: 4px; }
  .file-row {
    display:flex; align-items:center; gap:6px; padding:3px 5px; border-radius:6px; cursor:pointer;
    font-size:12.5px; color:var(--text-secondary);
  }
  .file-row:hover { background: var(--surface); color:var(--text-primary); }
  .node-chip {
    display:inline-flex; align-items:center; gap:5px; padding:2px 7px 2px 5px; margin:2px 4px 2px 0;
    border-radius:999px; border:1px solid var(--border-2); background:var(--page); cursor:pointer;
    font-size:11.5px; color:var(--text-secondary);
  }
  .node-chip:hover { border-color: var(--accent); color:var(--text-primary); }
  .chip-wrap { padding: 2px 0 4px 20px; }

  /* ---------- main graph area ---------- */
  main.graph-area { grid-area: main; position:relative; background: var(--page); overflow:hidden; }
  svg#graphSvg { width:100%; height:100%; display:block; cursor: grab; }
  svg#graphSvg.panning { cursor: grabbing; }

  .node-label {
    fill: var(--text-secondary); font-size: 9px; pointer-events:none; user-select:none;
  }
  .link { stroke: var(--edge); stroke-width: 1.2; }
  .link.hi { stroke: var(--edge-hi); stroke-width: 1.8; }
  .link.dim { opacity: .08; }
  .node circle { stroke: var(--page); stroke-width: 1.4; cursor: pointer; }
  .node.dim { opacity: .12; }
  .node.selected circle { stroke: #ffffff; stroke-width: 2.4; }
  .node.hidden, .link.hidden { display:none; }

  .graph-controls {
    position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:6px; z-index:5;
  }
  .graph-controls button {
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border-2);
    background: var(--surface); color: var(--text-primary); cursor:pointer; font-size:15px; line-height:1;
  }
  .graph-controls button:hover { background: var(--surface-2); border-color: var(--accent); }

  .legend {
    position:absolute; left:14px; bottom:14px; z-index:5;
    background: var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:8px 12px; display:flex; gap:14px; flex-wrap:wrap; max-width: 60%;
  }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
  .legend-item .swatch { width:10px; height:10px; border-radius:3px; }

  .hint {
    position:absolute; top:14px; left:14px; z-index:5; color:var(--text-muted); font-size:11.5px;
    background: rgba(26,26,25,0.7); padding:5px 9px; border-radius:7px; border:1px solid var(--border);
  }

  .tooltip {
    position:absolute; z-index:10; pointer-events:none;
    background: var(--surface); border:1px solid var(--border-2); border-radius:8px;
    padding:7px 10px; font-size:12px; color:var(--text-secondary); max-width:260px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .tooltip b { color: var(--text-primary); font-size:12.5px; }
  .tooltip .tt-meta { margin-top:3px; color:var(--text-muted); font-size:11px; }

  /* ---------- detail panel ---------- */
  .detail-empty {
    color: var(--text-muted); font-size:13px; padding: 20px 6px; text-align:center;
  }
  .detail-head { display:flex; flex-direction:column; gap:6px; margin-bottom: 10px;}
  .detail-title { font-size:16px; font-weight:700; word-break:break-word; }
  .badge-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .badge {
    display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 8px;
    border-radius:999px; border:1px solid var(--border-2); color:var(--text-secondary);
  }
  .badge .swatch { width:8px; height:8px; border-radius:50%; }
  .kv { display:grid; grid-template-columns: auto 1fr; gap:4px 10px; font-size:12px; margin: 10px 0; }
  .kv .k { color: var(--text-muted); }
  .kv .v { color: var(--text-secondary); overflow-wrap:anywhere; }
  .close-btn {
    background:none; border:1px solid var(--border-2); color:var(--text-secondary); border-radius:6px;
    padding:3px 8px; cursor:pointer; font-size:11px; align-self:flex-end;
  }
  .close-btn:hover { color: var(--text-primary); }

  .summary-box {
    background: var(--page); border:1px solid var(--border); border-radius:9px;
    padding:10px 11px; font-size:12.5px; color:var(--text-secondary); line-height:1.55; margin-bottom:10px;
  }
  .summary-box .note-icon { color: var(--c-rationale); margin-right:5px; }
  .rel-group { margin: 8px 0; }
  .rel-group .rel-title { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:4px; }

  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius:6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 60px 1fr; grid-template-areas: "top" "main"; }
    .menu-btn { display:inline-block; }
    aside.sidebar {
      position: fixed; top:60px; bottom:0; width: 300px; z-index: 20;
      box-shadow: 0 0 30px rgba(0,0,0,.5); transition: transform .18s ease;
    }
    .sidebar-left  { left:0; transform: translateX(-105%); }
    .sidebar-right { right:0; transform: translateX(105%); width: 320px; }
    .sidebar-left.open, .sidebar-right.open { transform: translateX(0); }
    .stats { display:none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="menu-btn" id="btnFilters">☰ Filters</button>
    <div class="brand"><span class="dot"></span> Sarathi — Knowledge Graph</div>
    <div class="stats" id="statsRow"></div>
    <div class="topbar-spacer"></div>
    <button class="menu-btn" id="btnDetails">ℹ Details</button>
  </header>

  <aside class="sidebar sidebar-left" id="sidebarLeft">
    <div class="panel">
      <h3>Search</h3>
      <input type="search" id="searchInput" placeholder="Search nodes, files, communities…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="panel">
      <h3>File type</h3>
      <div id="typeFilters"></div>
    </div>

    <div class="panel">
      <h3>Community <button id="commAllBtn">all / none</button></h3>
      <div class="scroll-list" id="commFilters"></div>
    </div>

    <div class="panel tree-panel">
      <h3>Folder hierarchy</h3>
      <div class="scroll-list" id="folderTree"></div>
    </div>
  </aside>

  <main class="graph-area">
    <svg id="graphSvg"></svg>
    <div class="hint">Scroll to zoom · drag background to pan · drag a node to move it</div>
    <div class="graph-controls">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">−</button>
      <button id="zoomReset" title="Reset view">⟲</button>
    </div>
    <div class="legend" id="graphLegend"></div>
    <div class="tooltip" id="tooltip" hidden></div>
  </main>

  <aside class="sidebar sidebar-right" id="sidebarRight">
    <div id="detailPanel"><div class="detail-empty">Click a node to see its code summary and relationships.</div></div>
  </aside>
</div>

/* ============================================================
   FORCE SIMULATION (dependency-free)
   ============================================================ */
let alpha = 1, alphaTarget = 0;
const ALPHA_DECAY = 0.985, ALPHA_MIN = 0.003;
const CENTER_X = 0, CENTER_Y = 0;

function tick() {
  if (alpha < alphaTarget) alpha = alphaTarget;
  // repulsion (all pairs) — fine at this graph size (74 nodes)
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i+1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let distSq = dx*dx + dy*dy || 0.01;
      const minDist = 60;
      if (distSq < minDist*minDist*9) {
        const dist = Math.sqrt(distSq);
        const force = (2200 / distSq) * alpha;
        const fx = (dx/dist) * force, fy = (dy/dist) * force;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }
  }
  // spring along edges
  const IDEAL = 70;
  links.forEach(l => {
    const a = l.s, b = l.t;
    let dx = b.x - a.x, dy = b.y - a.y;
    let dist = Math.sqrt(dx*dx + dy*dy) || 0.01;
    const diff = (dist - IDEAL) / dist * 0.06 * alpha;
    const fx = dx*diff, fy = dy*diff;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });
  // mild same-community clustering
  communityNodes.forEach(ids => {
    if (ids.length < 2) return;
    let cx = 0, cy = 0;
    ids.forEach(id => { const n = nodeById.get(id); cx += n.x; cy += n.y; });
    cx /= ids.length; cy /= ids.length;
    ids.forEach(id => {
      const n = nodeById.get(id);
      n.vx += (cx - n.x) * 0.010 * alpha;
      n.vy += (cy - n.y) * 0.010 * alpha;
    });
  });
  // gravity to center
  nodes.forEach(n => {
    n.vx += (CENTER_X - n.x) * 0.0025 * alpha;
    n.vy += (CENTER_Y - n.y) * 0.0025 * alpha;
  });
  // integrate
  nodes.forEach(n => {
    if (n.fx != null) { n.x = n.fx; n.vx = 0; } else { n.vx *= 0.82; n.x += n.vx; }
    if (n.fy != null) { n.y = n.fy; n.vy = 0; } else { n.vy *= 0.82; n.y += n.vy; }
  });
  alpha += (alphaTarget - alpha) * (alpha > alphaTarget ? ALPHA_DECAY - 1 : 0);
  alpha *= ALPHA_DECAY;
  render();
  if (alpha > ALPHA_MIN || alphaTarget > 0) requestAnimationFrame(tick);
}

function render() {
  linkEls.forEach((el, i) => {
    const l = links[i];
    el.setAttribute("x1", l.s.x); el.setAttribute("y1", l.s.y);
    el.setAttribute("x2", l.t.x); el.setAttribute("y2", l.t.y);
  });
  nodeEls.forEach((g, i) => {
    const n = nodes[i];
    g.setAttribute("transform", `translate(${n.x},${n.y})`);
  });
}
requestAnimationFrame(tick);
function reheat(v) { alpha = Math.max(alpha, v == null ? 0.6 : v); requestAnimationFrame(tick); }

/* ============================================================
   ZOOM / PAN
   ============================================================ */
let view = { x: 0, y: 0, k: 1 };
function applyView() {
  const rect = svg.getBoundingClientRect();
  viewport.setAttribute("transform",
    `translate(${rect.width/2 + view.x},${rect.height/2 + view.y}) scale(${view.k})`);
}
function screenToGraph(px, py) {
  const rect = svg.getBoundingClientRect();
  return { x: (px - rect.left - rect.width/2 - view.x) / view.k, y: (py - rect.top - rect.height/2 - view.y) / view.k };
}
applyView();
window.addEventListener("resize", applyView);

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left - rect.width/2, my = e.clientY - rect.top - rect.height/2;
  const prevK = view.k;
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  view.k = Math.min(4, Math.max(0.15, view.k * factor));
  view.x -= (mx - view.x) * (view.k/prevK - 1);
  view.y -= (my - view.y) * (view.k/prevK - 1);
  applyView();
}, { passive:false });

let panning = false, panStart = null;
svg.addEventListener("pointerdown", e => {
  if (e.target.closest(".node")) return;
  panning = true; svg.classList.add("panning");
  panStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  svg.setPointerCapture(e.pointerId);
  clearSelection();
});
svg.addEventListener("pointermove", e => {
  if (!panning) return;
  view.x = panStart.vx + (e.clientX - panStart.x);
  view.y = panStart.vy + (e.clientY - panStart.y);
  applyView();
});
svg.addEventListener("pointerup", () => { panning = false; svg.classList.remove("panning"); });

document.getElementById("zoomIn").onclick = () => { view.k = Math.min(4, view.k*1.25); applyView(); };
document.getElementById("zoomOut").onclick = () => { view.k = Math.max(0.15, view.k/1.25); applyView(); };
document.getElementById("zoomReset").onclick = () => { view = {x:0,y:0,k:1}; applyView(); };

const tooltip = document.getElementById("tooltip");

nodeEls.forEach((g, i) => {

  g.addEventListener("pointerdown", e => {
    e.stopPropagation();
    dragging = true;
    g.setPointerCapture(e.pointerId);
    reheat(0.8);
  });
  g.addEventListener("pointermove", e => {
    if (!dragging) return;
    const p = screenToGraph(e.clientX, e.clientY);
    n.fx = p.x; n.fy = p.y;
    reheat(0.7);
  });
  window.addEventListener("pointerup", () => {
    if (!dragging) return;
    dragging = false; n.fx = null; n.fy = null;
  });
  g.addEventListener("click", e => { e.stopPropagation(); selectNode(n.id); });

  g.addEventListener("mouseenter", e => {
    tooltip.hidden = false;

  });

});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* ============================================================
   FILTER / HIGHLIGHT STATE
   ============================================================ */
const activeTypes = new Set(Object.keys(typeCounts));
const activeComms = new Set(communityNodes.keys());
let selectedId = null;
let searchQuery = "";
let folderHighlightPrefix = null;

function visibleSet() {
  const s = new Set();
  nodes.forEach(n => { if (activeTypes.has(n.file_type) && activeComms.has(n.community)) s.add(n.id); });
  return s;
}

function dimSet() {
  // priority: selection > search > folder highlight > none
  if (selectedId) {
    const keep = new Set([selectedId]);
    outEdges.get(selectedId).forEach(l => keep.add(l.target));
    inEdges.get(selectedId).forEach(l => keep.add(l.source));
    return { active: true, keep };
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const keep = new Set();
    nodes.forEach(n => {
      const commLabel = (COMMUNITY_LABELS[n.community] || "").toLowerCase();
      if (n.label.toLowerCase().includes(q) || n.source_file.toLowerCase().includes(q) || commLabel.includes(q)) keep.add(n.id);
    });
    return { active: true, keep };
  }
  if (folderHighlightPrefix != null) {
    const keep = new Set();
    nodes.forEach(n => { if (n.source_file.startsWith(folderHighlightPrefix)) keep.add(n.id); });
    return { active: true, keep };
  }
  return { active: false, keep: null };
}

function refreshVisuals() {
  const visible = visibleSet();
  const { active, keep } = dimSet();

  nodeEls.forEach((g, i) => {
    const n = nodes[i];
    const isVisible = visible.has(n.id);
    g.classList.toggle("hidden", !isVisible);
    g.classList.toggle("dim", isVisible && active && !keep.has(n.id));
    g.classList.toggle("selected", n.id === selectedId);
  });
  linkEls.forEach((el, i) => {
    const l = links[i];
    const isVisible = visible.has(l.source) && visible.has(l.target);
    el.classList.toggle("hidden", !isVisible);
    const bothKept = active && keep.has(l.source) && keep.has(l.target);
    el.classList.toggle("hi", isVisible && bothKept && selectedId);
    el.classList.toggle("dim", isVisible && active && !bothKept);
  });
}

  const q = searchQuery.toLowerCase();
  const matches = nodes.filter(n =>
    n.label.toLowerCase().includes(q) ||
    n.source_file.toLowerCase().includes(q) ||
    (COMMUNITY_LABELS[n.community]||"").toLowerCase().includes(q)
  ).slice(0, 40);
  if (!matches.length) { searchResults.innerHTML = `<div class="none">No matches</div>`; return; }
  matches.forEach(n => {
    const row = document.createElement("div");
    row.className = "result-row";
    row.innerHTML = `<span class="swatch" style="background:${TYPE_COLORS[n.file_type]}"></span><span>${escapeHtml(n.label)}</span>`;
    row.addEventListener("click", () => { selectNode(n.id); focusOn(n); });
    searchResults.appendChild(row);
  });
}

/* ============================================================
   FOLDER HIERARCHY
   ============================================================ */
function buildTree(nodeList) {
  const root = { type:"folder", name:"/", children: new Map() };
  const external = { type:"file", name:"(builtin / no file)", path:"", nodesHere: [] };
  nodeList.forEach(n => {
    const path = n.source_file;
    if (!path) { external.nodesHere.push(n); return; }
    const parts = path.split("/");
    let cur = root;
    parts.forEach((seg, i) => {
      const isFile = i === parts.length - 1;
      if (!cur.children.has(seg)) {
        cur.children.set(seg, isFile
          ? { type:"file", name: seg, path, nodesHere: [] }
          : { type:"folder", name: seg, children: new Map() });
      }
      cur = cur.children.get(seg);
    });
    cur.nodesHere.push(n);
  });
  if (external.nodesHere.length) root.children.set(external.name, external);
  return root;
}

function renderTree(node) {
  if (node.type === "file") {
    const wrap = document.createElement("div");
    const row = document.createElement("div");
    row.className = "file-row";
    row.innerHTML = `<span>📄</span><span class="label">${escapeHtml(node.name)}</span><span class="cnt">${node.nodesHere.length}</span>`;
    row.addEventListener("click", () => {
      folderHighlightPrefix = node.path;
      searchQuery = ""; searchInput.value = ""; searchResults.innerHTML = "";
      clearSelectionKeepFocus();
      refreshVisuals();
    });
    wrap.appendChild(row);
    const chips = document.createElement("div");
    chips.className = "chip-wrap";
    node.nodesHere.forEach(n => {
      const chip = document.createElement("span");
      chip.className = "node-chip";
      chip.innerHTML = `<span class="swatch" style="background:${TYPE_COLORS[n.file_type]}"></span>${escapeHtml(n.label)}`;
      chip.addEventListener("click", (e) => { e.stopPropagation(); selectNode(n.id); focusOn(n); });
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);
    return wrap;
  }
  // folder
  const det = document.createElement("details");
  det.className = "tnode";
  const summary = document.createElement("summary");
  const count = countDescendants(node);
  summary.innerHTML = `<span class="tri">▶</span><span>📁</span><span class="label">${escapeHtml(node.name)}</span><span class="cnt">${count}</span>`;
  summary.addEventListener("click", (e) => {
    if (e.target.closest(".tri, span") && e.detail === 2) return; // avoid double toggle glitches
  });
  det.appendChild(summary);
  const indent = document.createElement("div");
  indent.className = "indent";
  Array.from(node.children.values())
    .sort((a,b) => (a.type===b.type ? a.name.localeCompare(b.name) : a.type==="folder" ? -1 : 1))
    .forEach(child => indent.appendChild(renderTree(child)));
  det.appendChild(indent);
  return det;
}
function countDescendants(node) {
  if (node.type === "file") return node.nodesHere.length;
  let c = 0;
  node.children.forEach(child => c += countDescendants(child));
  return c;
}

const tree = buildTree(nodes);
const folderTreeEl = document.getElementById("folderTree");
Array.from(tree.children.values())
  .sort((a,b) => (a.type===b.type ? a.name.localeCompare(b.name) : a.type==="folder" ? -1 : 1))
  .forEach(child => folderTreeEl.appendChild(renderTree(child)));

/* ============================================================
   SELECTION + DETAIL / CODE-SUMMARY PANEL
   ============================================================ */
const detailPanel = document.getElementById("detailPanel");
const RELATION_TEXT = {
  contains:   { out:"Defines",        in:"Defined in" },
  method:     { out:"Methods",        in:"Method of" },
  calls:      { out:"Calls",          in:"Called by" },
  inherits:   { out:"Inherits from",  in:"Subclassed by" },
  imports:    { out:"Imports",        in:"Imported by" },
  imports_from:{ out:"Imports from",  in:"Imported by" },
  references: { out:"References",     in:"Referenced by" },
  rationale_for:{ out:"Explains",     in:"" }, // handled separately via author's note
};

function selectNode(id) {
  selectedId = id;
  folderHighlightPrefix = null;
  refreshVisuals();
  renderDetail(id);
  document.getElementById("sidebarRight").classList.add("open");
}
function clearSelection() {
  if (!selectedId && !folderHighlightPrefix) return;
  selectedId = null; folderHighlightPrefix = null;
  refreshVisuals();
  detailPanel.innerHTML = `<div class="detail-empty">Click a node to see its code summary and relationships.</div>`;
}
function clearSelectionKeepFocus() { selectedId = null; }

function focusOn(n) {
  view.k = Math.max(view.k, 1.1);
  view.x = -n.x * view.k;
  view.y = -n.y * view.k;
  applyView();
}

function chip(n) {
  const c = document.createElement("span");
  c.className = "node-chip";
  c.innerHTML = `<span class="swatch" style="background:${TYPE_COLORS[n.file_type]}"></span>${escapeHtml(n.label)}`;
  c.addEventListener("click", () => selectNode(n.id));
  return c;
}

function renderDetail(id) {
  const n = nodeById.get(id);
  const commLabel = COMMUNITY_LABELS[n.community] || `Community ${n.community}`;

  detailPanel.innerHTML = "";
  const closeBtn = document.createElement("button");
  closeBtn.className = "close-btn"; closeBtn.textContent = "✕ close";
  closeBtn.addEventListener("click", clearSelection);
  detailPanel.appendChild(closeBtn);

  const head = document.createElement("div");
  head.className = "detail-head";
  head.innerHTML = `
    <div class="detail-title">${escapeHtml(n.label)}</div>
    <div class="badge-row">
      <span class="badge"><span class="swatch" style="background:${TYPE_COLORS[n.file_type]}"></span>${TYPE_LABELS[n.file_type]}</span>
      <span class="badge">${escapeHtml(commLabel)}</span>
    </div>
    <div class="kv">
      <div class="k">File</div><div class="v">${n.source_file ? escapeHtml(n.source_file) : "—"}</div>
      <div class="k">Location</div><div class="v">${n.loc || "—"}</div>
      <div class="k">Connections</div><div class="v">${degree.get(n.id)}</div>
    </div>`;
  detailPanel.appendChild(head);

  // ---- code summary ----
  const summary = document.createElement("div");
  summary.className = "summary-box";
  let summaryHtml = "";
  if (n.file_type === "rationale") {
    summaryHtml += `<span class="note-icon">✎</span><i>Author's note (extracted from source):</i><br>“${escapeHtml(n.label)}”`;
  } else if (rationaleForTarget.has(n.id)) {
    const r = rationaleForTarget.get(n.id);
    summaryHtml += `<span class="note-icon">✎</span><i>Author's note (extracted from source):</i><br>“${escapeHtml(r.label)}”`;
  } else {
    summaryHtml += `<i>No inline rationale extracted for this node — summary below is derived from graph structure.</i>`;
  }
  summary.innerHTML = summaryHtml;
  detailPanel.appendChild(summary);

  // ---- relationship groups ----
  const groups = new Map(); // key: "relation|dir" -> [{node, l}]
  outEdges.get(id).forEach(l => {
    if (l.relation === "rationale_for") return; // already shown as author's note
    const key = l.relation + "|out";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(l.t);
  });
  inEdges.get(id).forEach(l => {
    if (l.relation === "rationale_for") return;
    const key = l.relation + "|in";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(l.s);
  });

  if (groups.size === 0 && n.file_type !== "rationale" && !rationaleForTarget.has(n.id)) {
    const p = document.createElement("div");
    p.className = "detail-empty";
    p.textContent = "No structural relationships recorded for this node.";
    detailPanel.appendChild(p);
  }

  groups.forEach((list, key) => {
    const [relation, dir] = key.split("|");
    const meta = RELATION_TEXT[relation] || { out: relation, in: relation };
    const title = dir === "out" ? meta.out : meta.in;
    if (!title) return;
    const g = document.createElement("div");
    g.className = "rel-group";
    const t = document.createElement("div");
    t.className = "rel-title";
    t.textContent = `${title} (${list.length})`;
    g.appendChild(t);
    const wrap = document.createElement("div");
    list.forEach(neighborNode => wrap.appendChild(chip(neighborNode)));
    g.appendChild(wrap);
    detailPanel.appendChild(g);
  });

  // ---- hyperedges ----
  const hedges = hyperedgesByNode.get(id);
  if (hedges && hedges.length) {
    hedges.forEach(h => {
      const g = document.createElement("div");
      g.className = "rel-group";
      const t = document.createElement("div");
      t.className = "rel-title";
      t.textContent = `Hyperedge — ${h.label}`;
      g.appendChild(t);
      const wrap = document.createElement("div");
      h.nodes.filter(nid => nid !== id).forEach(nid => {
        const nb = nodeById.get(nid);
        if (nb) wrap.appendChild(chip(nb));
      });
      g.appendChild(wrap);
      detailPanel.appendChild(g);
    });
  }
}

/* ============================================================
   GRAPH LEGEND
   ============================================================ */
const legend = document.getElementById("graphLegend");
Object.keys(TYPE_LABELS).forEach(t => {
  if (!typeCounts[t]) return;
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<span class="swatch" style="background:${TYPE_COLORS[t]}"></span>${TYPE_LABELS[t]} (${typeCounts[t]})`;
  legend.appendChild(item);
});

/* ============================================================
   MOBILE DRAWERS
   ============================================================ */
const sidebarLeft = document.getElementById("sidebarLeft");
const sidebarRight = document.getElementById("sidebarRight");
document.getElementById("btnFilters").addEventListener("click", () => {
  sidebarLeft.classList.toggle("open"); sidebarRight.classList.remove("open");
});
document.getElementById("btnDetails").addEventListener("click", () => {
  sidebarRight.classList.toggle("open"); sidebarLeft.classList.remove("open");
});

refreshVisuals();
</script>
